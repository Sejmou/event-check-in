services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # Overrides whatever .env says: inside the container the DB lives on the volume.
      DATABASE_URL: /data/app.db
    volumes:
      - db:/data
    restart: unless-stopped

  # Dev-dependency image for one-off schema and seed runs against the same volume:
  #   docker compose run --rm tools pnpm db:push
  #   docker compose run --rm tools pnpm db:seed --admin ops@corp.com data/attendees.json
  tools:
    build:
      context: .
      target: build
    profiles:
      - tools
    # Same uid as the runtime image's `node`, or every file these commands create
    # on the volume belongs to root and the app — which does not run as root —
    # can read the database but not write to it.
    user: node
    env_file: .env
    environment:
      DATABASE_URL: /data/app.db
    volumes:
      - db:/data
      # The image has no data/ (.dockerignore), so the seed list comes from the host.
      - ./data:/app/data:ro

volumes:
  db:
